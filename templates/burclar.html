<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Günlük Burç Yorumu</title>
<meta name="description" content="Bugünün burç yorumları — her burç için tam video">
<style>
  :root { --bg:#120d1d; --card:#1d1530; --fg:#f3eefc; --muted:#a79fbd; --gold:#d4af37; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:28px 16px 48px; }
  h1 { font-size:1.5rem; margin:0; text-align:center; }
  .sub { text-align:center; color:var(--muted); margin:4px 0 22px; font-size:.95rem; }
  h2 { font-size:.85rem; letter-spacing:.08em; text-transform:uppercase;
       color:var(--gold); margin:24px 0 10px; }
  a.card { display:flex; align-items:center; gap:14px; text-decoration:none;
           color:var(--fg); background:var(--card); border-radius:14px;
           padding:14px 16px; margin-bottom:10px;
           border-left:5px solid var(--accent, var(--gold)); }
  a.card:active { opacity:.8; }
  .sym { font-size:1.9rem; width:40px; text-align:center; flex:none; }
  .txt { flex:1; min-width:0; }
  .name { font-weight:700; }
  .title { color:var(--muted); font-size:.88rem; overflow:hidden;
           text-overflow:ellipsis; display:-webkit-box;
           -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .play { flex:none; color:var(--gold); font-size:1.3rem; }
  a.channel { display:block; text-align:center; margin-top:26px; padding:14px;
              border-radius:14px; background:var(--gold); color:#1d1530;
              font-weight:700; text-decoration:none; }
</style>
</head>
<body><main>
<h1>🔮 Günlük Burç Yorumu</h1>
<p class="sub">{{ today }} · Burcuna dokun, tam yorumu izle</p>
{% for section in sections %}
<h2>{{ section.label }}</h2>
{% for e in section["items"] %}
<a class="card" href="{{ e.url }}" style="--accent: {{ e.color }}">
  <span class="sym">{{ e.symbol }}</span>
  <span class="txt"><span class="name">{{ e.name }}</span><br>
        <span class="title">{{ e.title }}</span></span>
  <span class="play">▶</span>
</a>
{% endfor %}
{% endfor %}
{% if channel_url %}<a class="channel" href="{{ channel_url }}">▶ YouTube kanalına git</a>{% endif %}
</main></body>
</html>
